<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fantasy FRC</title>
  <meta name="description" content="Predict FRC match winners and scores, pick the playoff bracket, and compete on a shared leaderboard with your team." />
  <meta name="theme-color" content="#171a21" />
  <link rel="icon" type="image/png" href="images/icon-192.png" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <meta name="app-version" content="" />
  <noscript><style>.auth-pending .auth-panel { visibility: visible !important; }</style></noscript>
</head>
<body class="auth-pending" data-tab="matchesTab">
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <div class="header-inner">
      <div class="logo"><img class="site-logo" src="images/FFRC.png" alt="Fantasy FRC" width="107" height="36" /></div>
      <nav id="mainNav" aria-label="Main">
        <button type="button" class="nav-btn active" id="nav-matches" data-tab="matchesTab" aria-current="page">Matches</button>
        <button type="button" class="nav-btn" id="nav-score" data-tab="scoreTab">My Score</button>
        <button type="button" class="nav-btn" id="nav-leaderboard" data-tab="leaderboardTab">Leaderboard</button>
        <button type="button" class="nav-btn hidden" id="nav-admin" data-tab="adminTab">Admin</button>
      </nav>
      <div class="header-right">
        <span id="saveStatus" class="save-status hidden" role="status" aria-live="polite"></span>
        <div class="header-profile hidden" id="headerProfileWrap">
          <button type="button" id="headerProfileBtn" class="header-profile-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"><span id="headerProfileInitial">G</span></button>
          <div id="headerProfilePanel" class="header-profile-panel hidden"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <div id="authNotice" class="notice hidden" role="alert"></div>
    <div id="inviteBanner" class="notice notice-info hidden" role="status"></div>

    <section id="authPanel" class="auth-panel">
      <div class="auth-copy">
        <h2>Playing as a guest</h2>
        <p>Your picks are saved on this device only. Sign in with Google to keep them everywhere, join a team and appear on the leaderboard.</p>
      </div>
      <div class="auth-actions">
        <div id="googleSignInHost" class="google-signin-host"></div>
      </div>
    </section>

    <div id="eventBar" class="event-bar">
      <div class="event-row">
        <label for="eventRegionSelect" class="sr-only">Event</label>
        <select id="eventRegionSelect"><option value="">Loading events...</option></select>
        <button type="button" id="refreshBtn" class="secondary-btn" title="Reload matches now">Refresh</button>
      </div>
      <div id="eventTools" class="event-tools">
        <label for="eventSearch" class="sr-only">Search events</label>
        <input id="eventSearch" type="search" class="field-input hidden" placeholder="Search events by name or place" autocomplete="off" />
        <label class="check-inline"><input type="checkbox" id="eventShowAll" /> Show all events</label>
        <span id="eventUpdated" class="muted small"></span>
      </div>
    </div>
    <div id="serverStatusBanner" class="notice hidden" role="status"></div>

    <div id="matchesTab" class="tab-panel">
      <div id="helpHost"></div>
      <div id="matchesEmpty"></div>
      <div id="matchesSummary" class="hidden"></div>
      <div id="viewSwitch" class="segmented hidden" role="group" aria-label="What to show">
        <button type="button" class="seg-btn active" data-view="matches" aria-pressed="true">Matches</button>
        <button type="button" class="seg-btn" data-view="bracket" aria-pressed="false">Playoff bracket</button>
      </div>
      <div id="matchesView"></div>
      <div id="playoffBracket" class="hidden"></div>
    </div>

    <div id="scoreTab" class="tab-panel hidden">
      <div id="scoreContent"></div>
    </div>

    <div id="leaderboardTab" class="tab-panel hidden">
      <div class="leaderboard-shell">
        <h2 id="leaderboardEvent">Standings</h2>
        <div class="segmented" id="leaderboardFilters"></div>
        <div id="leaderboardContent"></div>
      </div>
    </div>

    <div id="adminTab" class="tab-panel hidden">
      <div class="admin-shell">
        <h2>Admin</h2>
        <div id="adminAccessNotice" class="notice hidden"></div>
        <div id="adminPanel"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <details class="footer-feedback">
        <summary>Send feedback or report a problem</summary>
        <form id="feedbackForm" class="footer-form">
          <input id="feedbackName" type="text" maxlength="100" class="field-input" placeholder="Name (optional)" aria-label="Name (optional)" />
          <input id="feedbackContact" type="text" maxlength="200" class="field-input" placeholder="Email or contact, if you'd like a reply (optional)" aria-label="Email or contact (optional)" />
          <textarea id="feedbackMessage" maxlength="2000" class="field-input footer-textarea" placeholder="What's on your mind?" aria-label="Feedback message" required></textarea>
          <button type="submit" class="secondary-btn">Send feedback</button>
        </form>
        <div id="feedbackNotice" class="notice hidden" role="status"></div>
      </details>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
